<div class="sidebar-layout">
  <!-- Mobile overlay -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 z-30 bg-black/50 lg:hidden"
      (click)="sidebarOpen.set(false)"
    ></div>
  }

  <!-- Sidebar -->
  <aside
    class="sidebar"
    [class.sidebar-open]="sidebarOpen()"
  >
    <div class="flex flex-col h-full">
      <!-- Logo -->
      <div class="flex items-center gap-3 px-5 h-16 border-b border-gray-800">
        <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 3.104v5.714a2.25 2.25 0 0 1-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 0 1 4.5 0m0 0v5.714a2.25 2.25 0 0 0 .659 1.591L19 14.5" />
          </svg>
        </div>
        <span class="text-sm font-semibold text-white tracking-wide">Bot Platform</span>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 px-3 py-4 overflow-y-auto">
        @for (section of navSections; track section.title) {
          <div class="mb-4">
            <p class="px-3 mb-1 text-[11px] font-semibold uppercase tracking-wider text-gray-500">
              {{ section.title }}
            </p>
            @for (item of section.items; track item.route) {
              <a
                [routerLink]="item.route"
                routerLinkActive="bg-gray-800 text-white"
                [routerLinkActiveOptions]="{ exact: false }"
                class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white transition-colors"
                (click)="sidebarOpen.set(false)"
              >
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.svgPath" />
                </svg>
                {{ item.label }}
              </a>
            }
          </div>
        }
      </nav>

      <!-- User info -->
      <div class="px-3 py-4 border-t border-gray-800">
        <div class="flex items-center gap-3 px-3">
          <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center">
            <span class="text-xs font-semibold text-gray-300">CR</span>
          </div>
          <div class="min-w-0">
            <p class="text-sm font-medium text-gray-300 truncate">Carlos Rivera</p>
            <p class="text-xs text-gray-500 truncate">Admin</p>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <div class="main-content">
    <!-- Top bar -->
    <header class="topbar">
      <button
        class="lg:hidden p-1.5 text-gray-500 hover:text-gray-700 rounded-md hover:bg-gray-100 cursor-pointer"
        (click)="sidebarOpen.set(!sidebarOpen())"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <div class="flex-1"></div>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-y-auto p-6">
      <ng-content></ng-content>
    </main>
  </div>
</div>

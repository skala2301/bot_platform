<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
  (click)="cancelled.emit()"
>
  <div
    class="bg-white rounded-lg shadow-xl p-6 max-w-md w-full mx-4"
    (click)="$event.stopPropagation()"
  >
    <h3 class="text-lg font-semibold text-slate-900 mb-2">
      {{ title() }}
    </h3>
    <p class="text-slate-600 mb-6">{{ message() }}</p>
    <div class="flex justify-end gap-3">
      <button
        class="px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors cursor-pointer"
        (click)="cancelled.emit()"
      >
        Cancel
      </button>
      <button
        class="px-4 py-2 text-sm font-medium text-white rounded-lg transition-colors cursor-pointer"
        [class]="confirmClass()"
        (click)="confirmed.emit()"
      >
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>

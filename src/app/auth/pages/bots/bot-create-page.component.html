<div class="max-w-2xl mx-auto">
  <!-- Header -->
  <div class="mb-6">
    <a routerLink="/bots" class="text-sm text-brand-secondary hover:underline mb-2 inline-block">&larr; Back to Bots</a>
    <h1 class="text-2xl font-bold text-slate-900">Create Bot</h1>
    <p class="text-sm text-slate-500 mt-1">Configure your new chatbot</p>
  </div>

  <!-- Error -->
  @if (error(); as err) {
    <div class="mb-4 p-4 bg-danger-tint border border-danger/40 text-danger-dark rounded-lg text-sm">
      {{ err }}
    </div>
  }

  <!-- Form -->
  <form (ngSubmit)="onSubmit()" class="bg-white rounded-lg border border-slate-200 p-6 space-y-5">
    <!-- Name -->
    <div>
      <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Name *</label>
      <input
        id="name"
        type="text"
        [(ngModel)]="form.name"
        name="name"
        required
        maxlength="255"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
        placeholder="e.g. Customer Support Bot"
      />
    </div>

    <!-- Language -->
    <div>
      <label for="language" class="block text-sm font-medium text-slate-700 mb-1">Language</label>
      <select
        id="language"
        [(ngModel)]="form.language_code"
        name="language_code"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
      >
        @for (lang of languages; track lang.code) {
          <option [value]="lang.code">{{ lang.label }}</option>
        }
      </select>
    </div>

    <!-- System prompt -->
    <div>
      <label for="system_prompt" class="block text-sm font-medium text-slate-700 mb-1">System Prompt</label>
      <textarea
        id="system_prompt"
        [(ngModel)]="form.system_prompt"
        name="system_prompt"
        rows="3"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none resize-y"
        placeholder="Instructions for how the bot should behave..."
      ></textarea>
    </div>

    <!-- Tone -->
    <div>
      <label for="tone" class="block text-sm font-medium text-slate-700 mb-1">Tone</label>
      <input
        id="tone"
        type="text"
        [(ngModel)]="form.tone"
        name="tone"
        maxlength="50"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
        placeholder="e.g. friendly, professional, casual"
      />
    </div>

    <!-- Fallback message -->
    <div>
      <label for="fallback" class="block text-sm font-medium text-slate-700 mb-1">Fallback Message</label>
      <input
        id="fallback"
        type="text"
        [(ngModel)]="form.fallback_message"
        name="fallback_message"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
        placeholder="Message when no relevant info is found"
      />
    </div>

    <!-- Model -->
    <div class="pt-4 border-t border-slate-100">
      <h3 class="text-sm font-semibold text-slate-900 mb-1">Model</h3>
      <p class="text-xs text-slate-500 mb-3">Choose which LLM will power this bot.</p>
      <app-bot-model-selector
        [modelLocation]="modelLocation()"
        [modelName]="modelName()"
        [disabled]="saving()"
        (modelLocationChange)="modelLocation.set($event)"
        (modelNameChange)="modelName.set($event)"
      />
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
      <a
        routerLink="/bots"
        class="px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors"
      >
        Cancel
      </a>
      <button
        type="submit"
        [disabled]="!canSubmit()"
        class="px-4 py-2 text-sm font-medium text-white bg-brand-primary rounded-lg hover:bg-brand-secondary transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
      >
        @if (saving()) {
          Creating...
        } @else {
          Create Bot
        }
      </button>
    </div>
  </form>
</div>

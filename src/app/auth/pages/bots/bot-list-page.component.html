<div class="max-w-6xl mx-auto">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Bots</h1>
      <p class="text-sm text-gray-500 mt-1">Manage your chatbots</p>
    </div>
    <a
      routerLink="/bots/create"
      class="inline-flex items-center gap-2 px-4 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Create Bot
    </a>
  </div>

  <!-- Error -->
  @if (error(); as err) {
    <div class="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
      {{ err }}
    </div>
  }

  <!-- Loading -->
  @if (loading()) {
    <div class="flex justify-center py-12">
      <div class="w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
    </div>
  } @else {
    @if (bots().length === 0) {
      <div class="text-center py-12 text-sm text-gray-500">
        No bots created yet. Use the button above to create one.
      </div>
    } @else {
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        @for (bot of bots(); track bot.uid) {
          <app-bot-card
            [bot]="bot"
            (edit)="onEdit($event)"
            (chat)="onChat($event)"
            (delete)="onDeleteRequest($event)"
          />
        }
      </div>
    }
  }

  <!-- Delete confirmation dialog -->
  @if (botToDelete(); as bot) {
    <app-confirm-dialog
      [title]="'Delete Bot'"
      [message]="'Are you sure you want to delete &quot;' + bot.name + '&quot;? All ingested knowledge will be permanently lost.'"
      [confirmText]="'Delete'"
      (confirmed)="onDeleteConfirm()"
      (cancelled)="onDeleteCancel()"
    />
  }
</div>

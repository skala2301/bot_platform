<div class="space-y-6">
  <!-- FAQ form -->
  <div class="bg-white rounded-lg border border-gray-200 p-6">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h3 class="text-base font-semibold text-gray-900">Add FAQs</h3>
        <p class="text-sm text-gray-500 mt-1">Add question and answer pairs to train the bot.</p>
      </div>
      <button
        type="button"
        class="px-3 py-1.5 text-xs font-medium text-indigo-700 bg-indigo-50 rounded-md hover:bg-indigo-100 transition-colors cursor-pointer"
        (click)="addFaq()"
      >
        + Add FAQ
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      @for (faq of faqs(); track $index; let i = $index) {
        <div class="bg-gray-50 rounded-lg p-4 relative">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold text-gray-500">FAQ #{{ i + 1 }}</span>
            @if (faqs().length > 1) {
              <button
                type="button"
                class="text-xs text-red-600 hover:text-red-800 font-medium cursor-pointer"
                (click)="removeFaq(i)"
              >
                Remove
              </button>
            }
          </div>
          <div class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Question</label>
              <input
                type="text"
                [ngModel]="faq.q"
                (ngModelChange)="updateFaq(i, 'q', $event)"
                [name]="'q_' + i"
                placeholder="What is your return policy?"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Answer</label>
              <textarea
                [ngModel]="faq.a"
                (ngModelChange)="updateFaq(i, 'a', $event)"
                [name]="'a_' + i"
                rows="2"
                placeholder="You can return items within 30 days..."
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-y"
              ></textarea>
            </div>
          </div>
        </div>
      }

      <div class="flex justify-end pt-2">
        <button
          type="submit"
          [disabled]="submitting()"
          class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
        >
          @if (submitting()) {
            Submitting...
          } @else {
            Submit FAQs
          }
        </button>
      </div>
    </form>
  </div>

  <!-- Error -->
  @if (error(); as err) {
    <div class="p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
      {{ err }}
    </div>
  }

  <!-- Active jobs -->
  @if (activeJobs().length > 0) {
    <div class="space-y-3">
      <h3 class="text-sm font-semibold text-gray-700">Processing FAQs</h3>
      @for (job of activeJobs(); track job.jobId) {
        <app-ingestion-job
          [jobId]="job.jobId"
          [label]="job.label"
          (completed)="onJobCompleted($event, job)"
          (cancelled)="onJobCancelled($event)"
        />
      }
    </div>
  }
</div>

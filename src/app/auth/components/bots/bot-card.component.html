<div class="bg-white rounded-lg border border-slate-200 p-5 hover:shadow-md transition-shadow">
  <!-- Header -->
  <div class="flex items-start justify-between mb-3">
    <h3 class="text-base font-semibold text-slate-900 truncate">{{ bot().name }}</h3>
    @if (bot().language_code) {
      <span class="ml-2 shrink-0 px-2 py-0.5 text-xs font-medium bg-info-tint text-brand-secondary rounded">
        {{ bot().language_code }}
      </span>
    }
  </div>

  <!-- Details -->
  <div class="space-y-2 mb-4 text-sm text-slate-600">
    @if (bot().system_prompt) {
      <p class="line-clamp-2">
        <span class="font-medium text-slate-700">Prompt:</span>
        {{ bot().system_prompt }}
      </p>
    }
    @if (bot().tone) {
      <p>
        <span class="font-medium text-slate-700">Tone:</span>
        {{ bot().tone }}
      </p>
    }
  </div>

  <!-- Actions -->
  <div class="flex gap-2 pt-3 border-t border-slate-100">
    <button
      class="flex-1 px-3 py-1.5 text-xs font-medium text-white bg-brand-primary rounded-md hover:bg-brand-secondary transition-colors cursor-pointer"
      (click)="chat.emit(bot())"
    >
      Chat
    </button>
    <button
      class="flex-1 px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 rounded-md hover:bg-slate-200 transition-colors cursor-pointer"
      (click)="edit.emit(bot())"
    >
      Edit
    </button>
    <button
      class="flex-1 px-3 py-1.5 text-xs font-medium text-danger-dark bg-danger-tint rounded-md hover:bg-danger/20 transition-colors cursor-pointer"
      (click)="delete.emit(bot())"
    >
      Delete
    </button>
  </div>
</div>

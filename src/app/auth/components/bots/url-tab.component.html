<div class="space-y-6">
  <!-- Add URL form -->
  <div class="bg-white rounded-lg border border-slate-200 p-6">
    <h3 class="text-base font-semibold text-slate-900 mb-3">Add URL</h3>
    <p class="text-sm text-slate-500 mb-4">Scrape a webpage and ingest its content into the bot's knowledge base.</p>

    <form (ngSubmit)="onSubmit()" class="flex gap-3">
      <input
        type="url"
        [ngModel]="urlInput()"
        (ngModelChange)="urlInput.set($event)"
        name="url"
        placeholder="https://example.com/page"
        class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
      />
      <button
        type="submit"
        [disabled]="submitting() || !urlInput().trim()"
        class="px-4 py-2 text-sm font-medium text-white bg-brand-primary rounded-lg hover:bg-brand-secondary transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer shrink-0"
      >
        @if (submitting()) {
          Adding...
        } @else {
          Add URL
        }
      </button>
    </form>
  </div>

  <!-- Error -->
  @if (error(); as err) {
    <div class="p-4 bg-danger-tint border border-danger/40 text-danger-dark rounded-lg text-sm">
      {{ err }}
    </div>
  }

  <!-- Active jobs -->
  @if (activeJobs().length > 0) {
    <div class="space-y-3">
      <h3 class="text-sm font-semibold text-slate-700">Processing URLs</h3>
      @for (job of activeJobs(); track job.jobId) {
        <app-ingestion-job
          [jobId]="job.jobId"
          [label]="job.label"
          (completed)="onJobCompleted($event, job)"
          (cancelled)="onJobCancelled($event)"
        />
      }
    </div>
  }
</div>

<!-- Error -->
@if (error(); as err) {
  <div class="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
    {{ err }}
  </div>
}

<!-- Success -->
@if (success(); as msg) {
  <div class="mb-4 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm">
    {{ msg }}
  </div>
}

<form (ngSubmit)="onSaveRequest()" class="bg-white rounded-lg border border-gray-200 p-6 space-y-5">
  <!-- Name -->
  <div>
    <label for="edit-name" class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
    <input
      id="edit-name"
      type="text"
      [(ngModel)]="form.name"
      name="name"
      required
      maxlength="255"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
    />
  </div>

  <!-- Language -->
  <div>
    <label for="edit-language" class="block text-sm font-medium text-gray-700 mb-1">Language</label>
    <select
      id="edit-language"
      [(ngModel)]="form.language_code"
      name="language_code"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
    >
      @for (lang of languages; track lang.code) {
        <option [value]="lang.code">{{ lang.label }}</option>
      }
    </select>
  </div>

  <!-- System Prompt -->
  <div>
    <label for="edit-prompt" class="block text-sm font-medium text-gray-700 mb-1">System Prompt</label>
    <textarea
      id="edit-prompt"
      [(ngModel)]="form.system_prompt"
      name="system_prompt"
      rows="3"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-y"
    ></textarea>
  </div>

  <!-- Tone -->
  <div>
    <label for="edit-tone" class="block text-sm font-medium text-gray-700 mb-1">Tone</label>
    <input
      id="edit-tone"
      type="text"
      [(ngModel)]="form.tone"
      name="tone"
      maxlength="50"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
    />
  </div>

  <!-- Fallback Message -->
  <div>
    <label for="edit-fallback" class="block text-sm font-medium text-gray-700 mb-1">Fallback Message</label>
    <input
      id="edit-fallback"
      type="text"
      [(ngModel)]="form.fallback_message"
      name="fallback_message"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
    />
  </div>

  <!-- Actions -->
  <div class="flex justify-end pt-4 border-t border-gray-100">
    <button
      type="submit"
      [disabled]="saving() || !form.name.trim()"
      class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
    >
      @if (saving()) {
        Saving...
      } @else {
        Save Changes
      }
    </button>
  </div>
</form>

<!-- Confirm dialog -->
@if (showConfirm()) {
  <app-confirm-dialog
    [title]="'Save Changes'"
    [message]="'Are you sure you want to update this bot\'s configuration?'"
    [confirmText]="'Save'"
    [confirmClass]="'bg-indigo-600 hover:bg-indigo-700'"
    (confirmed)="onSaveConfirm()"
    (cancelled)="showConfirm.set(false)"
  />
}

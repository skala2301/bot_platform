<div class="space-y-4">
  @for (group of groups; track group.label) {
    <div>
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">{{ group.label }}</p>
      <div class="space-y-1.5">
        @for (perm of group.permissions; track perm.key) {
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="checkbox"
              [checked]="isChecked(perm.key)"
              (change)="toggle(perm.key)"
              class="w-3.5 h-3.5 accent-brand-primary"
            />
            <span class="text-sm text-slate-700">{{ perm.description }}</span>
            <span class="text-[10px] text-slate-400 font-mono">{{ perm.key }}</span>
          </label>
        }
      </div>
    </div>
  }
</div>

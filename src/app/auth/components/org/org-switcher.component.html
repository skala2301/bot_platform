<div class="relative px-3 mb-2">
  <button
    class="w-full flex items-center justify-between px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-800 transition-colors cursor-pointer"
    (click)="toggle()"
  >
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-6 h-6 bg-indigo-500 rounded flex items-center justify-center shrink-0">
        <span class="text-[10px] font-bold text-white">{{ (currentOrg()?.name ?? 'O')[0] | uppercase }}</span>
      </div>
      <span class="truncate">{{ currentOrg()?.name ?? 'Select organization' }}</span>
    </div>
    <svg
      class="w-4 h-4 shrink-0 text-gray-500 transition-transform duration-200"
      [class.rotate-180]="open()"
      fill="none" stroke="currentColor" viewBox="0 0 24 24"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (open()) {
    <div class="absolute left-3 right-3 mt-1 bg-gray-800 rounded-md border border-gray-700 shadow-lg z-20 max-h-64 overflow-y-auto">
      @for (org of orgs(); track org.uid) {
        <button
          class="w-full text-left px-3 py-2 text-sm text-gray-300 hover:bg-gray-700 transition-colors cursor-pointer flex items-center gap-2"
          [class.bg-gray-700]="currentOrg()?.uid === org.uid"
          (click)="selectOrg(org)"
        >
          <div class="w-5 h-5 bg-indigo-500/60 rounded flex items-center justify-center shrink-0">
            <span class="text-[9px] font-bold text-white">{{ org.name[0] | uppercase }}</span>
          </div>
          <span class="truncate">{{ org.name }}</span>
          @if (currentOrg()?.uid === org.uid) {
            <svg class="w-3.5 h-3.5 text-indigo-400 shrink-0 ml-auto" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd" />
            </svg>
          }
        </button>
      }
      <div class="border-t border-gray-700">
        <button
          class="w-full text-left px-3 py-2 text-sm text-indigo-400 hover:bg-gray-700 transition-colors cursor-pointer"
          (click)="createOrg()"
        >
          + Create organization
        </button>
      </div>
    </div>
  }
</div>

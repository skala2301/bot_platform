<div class="bg-white rounded-lg border border-slate-200 p-6 shadow-sm">
  <h1 class="text-xl font-bold text-slate-900 mb-1">Sign in</h1>
  <p class="text-sm text-slate-500 mb-6">Enter your credentials to access the platform</p>

  @if (error(); as err) {
    <div class="mb-4 p-3 bg-danger-tint border border-danger/40 text-danger-dark rounded-lg text-sm">
      {{ err }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
      <input
        id="email"
        type="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
        required
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
        placeholder="you@example.com"
        [disabled]="loading()"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
      <input
        id="password"
        type="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
        required
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
        placeholder="Enter your password"
        [disabled]="loading()"
      />
    </div>

    <div class="flex items-center justify-end">
      <a routerLink="/forgot-password" class="text-xs text-brand-secondary hover:underline">Forgot password?</a>
    </div>

    <button
      type="submit"
      [disabled]="loading() || !email().trim() || !password()"
      class="w-full px-4 py-2.5 text-sm font-medium text-white bg-brand-primary rounded-lg hover:bg-brand-secondary transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
    >
      @if (loading()) {
        Signing in...
      } @else {
        Sign in
      }
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-500">
    Don't have an account?
    <a routerLink="/register" class="text-brand-secondary hover:underline font-medium">Register</a>
  </p>
</div>

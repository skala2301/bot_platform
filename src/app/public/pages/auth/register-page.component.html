<div class="bg-white rounded-lg border border-slate-200 p-6 shadow-sm">
  <h1 class="text-xl font-bold text-slate-900 mb-1">Create account</h1>
  <p class="text-sm text-slate-500 mb-6">Register to start building your bots</p>

  @if (success()) {
    <div class="p-4 bg-success-tint border border-success/40 rounded-lg">
      <p class="text-sm text-success-dark font-medium mb-1">Registration successful!</p>
      <p class="text-sm text-success-dark">Please check your email (or backend console) to verify your account.</p>
      <a routerLink="/verify-email" class="inline-block mt-3 text-sm text-brand-secondary hover:underline font-medium">Verify email</a>
      <span class="text-sm text-slate-400 mx-2">or</span>
      <a routerLink="/login" class="text-sm text-brand-secondary hover:underline font-medium">Sign in</a>
    </div>
  } @else {
    @if (error(); as err) {
      <div class="mb-4 p-3 bg-danger-tint border border-danger/40 text-danger-dark rounded-lg text-sm">
        {{ err }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label for="first_name" class="block text-sm font-medium text-slate-700 mb-1">First name</label>
          <input
            id="first_name"
            type="text"
            [(ngModel)]="form.first_name"
            name="first_name"
            required
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
            [disabled]="loading()"
          />
        </div>
        <div>
          <label for="last_name" class="block text-sm font-medium text-slate-700 mb-1">Last name</label>
          <input
            id="last_name"
            type="text"
            [(ngModel)]="form.last_name"
            name="last_name"
            required
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
            [disabled]="loading()"
          />
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="form.email"
          name="email"
          required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
          placeholder="you@example.com"
          [disabled]="loading()"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="form.password"
          name="password"
          required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
          [disabled]="loading()"
        />
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-1">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="form.confirmPassword"
          name="confirmPassword"
          required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-secondary focus:border-brand-secondary outline-none"
          [disabled]="loading()"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading() || !form.email.trim() || !form.password || !form.first_name.trim() || !form.last_name.trim()"
        class="w-full px-4 py-2.5 text-sm font-medium text-white bg-brand-primary rounded-lg hover:bg-brand-secondary transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
      >
        @if (loading()) {
          Creating account...
        } @else {
          Create account
        }
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Already have an account?
      <a routerLink="/login" class="text-brand-secondary hover:underline font-medium">Sign in</a>
    </p>
  }
</div>
